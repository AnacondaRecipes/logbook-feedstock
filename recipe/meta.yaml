{% set name = "logbook" %}
{% set version = "1.9.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0538cabfd8e8a02b8185fb7a2be20b3965d225fbd7f4a5726b007d8e26b39ee0

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<39]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
  host:
    - pip
    - python
    - setuptools
    - setuptools-rust >=1.11.1
    - cython
  run:
    - python
    - typing-extensions >=4.14.0
  run_constrained:
    - execnet >=1.0.9
    - sqlalchemy >=1.4
    - brotli >=1.1.0

test:
  imports:
    - logbook
  source_files:
    - tests
  commands:
    - pip check
    # issue: https://github.com/getlogbook/logbook/issues/308 <- test_compression_file_handler
    # brotlipy is not available for py>311.--deselect=tests/test_file_handler.py::test_compression_file_handler
    - pytest -v tests 
  requires:
    - pip
    - pytest >=6
    - brotli

about:
  home: https://github.com/getlogbook/logbook
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Logbook is a nice logging replacement
  description: |
    Logbook is a logging system for Python that replaces the standard library's logging module. It was designed with both complex and simple applications in mind and the idea to make logging fun.
  doc_url: https://logbook.readthedocs.io
  dev_url: https://github.com/getlogbook/logbook

extra:
  recipe-maintainers:
    - maresb
    - simonvh
    - Ryan-Dmello
