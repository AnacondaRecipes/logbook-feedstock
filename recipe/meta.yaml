{% set name = "logbook" %}
{% set version = "1.10.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7fdf8d09d60c9eaa4d8d27b37363b4ce277d019f4cae5c259ea03040f7b634b7

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<39]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
  host:
    - pip
    - python
    - setuptools
    - setuptools-rust >=1.11.1
    - cython
  run:
    - python
    - typing-extensions >=4.14.0
  run_constrained:
    # extra brotli
    - brotli >=1.1.0
    # extra execnet
    - execnet >=1.5
    # extra Jinja2
    - Jinja2 >=2.11.3
    # extra redis
    - redis >=4.6.0
    # extra sqlalchemy
    - sqlalchemy >=1.4
    # extra zmq
    - pyzmq >=27.0.2

{% set deselected_tests = "--deselect=tests/test_utils.py::test_logged_if_slow_deprecated" %}
{% set deselected_tests = deselected_tests + " --deselect=tests/test_utils.py::test_logged_if_slow_logger" %}
{% set deselected_tests = deselected_tests + " --deselect=tests/test_utils.py::test_logged_if_slow_reached" %}
{% set deselected_tests = deselected_tests + " --deselect=tests/test_utils.py::test_logged_if_slow_level" %}
{% set deselected_tests = deselected_tests + " --deselect=tests/test_utils.py::test_logged_if_slow_did_not_reached" %}


test:
  imports:
    - logbook
  source_files:
    - tests
  commands:
    - pip check
    - pytest -vv tests {{ deselected_tests }} # [osx]
  requires:
    - pip
    - pytest >=6
    - brotli

about:
  home: https://github.com/getlogbook/logbook
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Logbook is a nice logging replacement
  description: |
    Logbook is a logging system for Python that replaces the standard library's logging module. It was designed with both complex and simple applications in mind and the idea to make logging fun.
  doc_url: https://logbook.readthedocs.io
  dev_url: https://github.com/getlogbook/logbook

extra:
  recipe-maintainers:
    - maresb
    - simonvh
    - Ryan-Dmello
